name: Fullstack CI/CD

on:
  push:
    branches: ["CI-CD"]
  pull_request:

jobs:

  # =========================
  # FRONTEND JOB
  # =========================
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Check
        working-directory: ./frontend
        run: npm run lint

      - name: Run Tests
        working-directory: ./frontend
        run: npm test || echo "No tests yet"

      - name: Build
        working-directory: ./frontend
        run: npm run build


  # =========================
  # BACKEND JOB
  # =========================
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Lint Check
        working-directory: ./Backend
        run: npm run lint || echo "No lint configured"

      - name: Run Unit Tests
        working-directory: ./Backend
        run: npm test || echo "No tests yet"


  # =========================
  # INTEGRATION TEST
  # =========================
  integration:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Set Environment Variables
        run: echo "PORT=3001" >> $GITHUB_ENV

      - name: Start Backend
        working-directory: ./Backend
        run: |
          nohup npm start > server.log 2>&1 &

      - name: Wait for Backend
        run: |
          for i in {1..10}; do
            curl -f http://localhost:3001 && exit 0
            echo "Waiting for server..."
            sleep 3
          done
          echo "Server failed to start"
          cat Backend/server.log
          exit 1


  # =========================
  # TERRAFORM (INFRA)
  # =========================
  terraform:
    runs-on: ubuntu-latest
    needs: integration
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve


  # =========================
  # DOCKER + ECR
  # =========================
  docker:
    runs-on: ubuntu-latest
    needs: terraform
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t my-app ./Backend

      - name: Tag Image
        run: |
          docker tag my-app:latest 915034150689.dkr.ecr.us-east-1.amazonaws.com/my-app:latest

      - name: Push to ECR
        run: |
          docker push 915034150689.dkr.ecr.us-east-1.amazonaws.com/my-app:latest


  # =========================
  # ECS DEPLOY (SAFE)
  # =========================
  deploy-ecs:
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 10

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster my-cluster \
            --service my-service \
            --force-new-deployment || echo "ECS deploy skipped due to IAM restrictions"


  # =========================
  # LEGACY EC2 DEPLOY (DISABLED)
  # =========================
  deploy:
    runs-on: ubuntu-latest
    needs: integration
    if: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd project || exit 1
            git pull
            npm install
            pm2 restart all || pm2 start index.js