name: Fullstack CI/CD

on:
  push:
    branches:
      - CI-CD

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test --if-present

      - name: Build Frontend
        run: npm run build

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test --if-present

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs:
      - frontend-checks
      - backend-checks

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Integration Tests Placeholder
        run: echo "Integration tests passed"

  docker-build-and-deploy:
    name: Docker Build and ECS Deploy
    runs-on: ubuntu-latest
    needs:
      - integration-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t my-app .
          docker tag my-app:latest 915034150689.dkr.ecr.us-east-1.amazonaws.com/my-app:latest

      - name: Push Docker Image to ECR
        run: |
          docker push 915034150689.dkr.ecr.us-east-1.amazonaws.com/my-app:latest

      - name: Force ECS Redeployment
        run: |
          aws ecs update-service \
            --cluster my-cluster \
            --service my-task-service-ye9gs174 \
            --force-new-deployment
